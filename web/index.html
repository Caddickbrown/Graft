<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">✦</span>
      <span class="brand-name">Graft</span>
    </div>
    <div class="nav-section">
      <a href="today.html" class="nav-item" data-page="today">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        Today
      </a>
      <a href="index.html" class="nav-item active" data-page="projects">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="9" height="9" rx="1"/><rect x="13" y="3" width="9" height="9" rx="1"/><rect x="2" y="13" width="9" height="9" rx="1"/><rect x="13" y="13" width="9" height="9" rx="1"/></svg>
        Projects
      </a>
      <a href="issues.html" class="nav-item" data-page="issues">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        All issues
      </a>
    </div>
    <div class="nav-section nav-projects" id="sidebar-projects"></div>
    <div class="theme-toggle">
      <button class="theme-toggle-btn" onclick="GRAFT.toggleTheme()"></button>
    </div>
  </nav>

  <main class="main">
    <header class="page-header">
      <div>
        <h1 class="page-title">Projects</h1>
        <p class="page-subtitle" id="projects-subtitle">Loading…</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" onclick="GRAFT.createArea()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          New area
        </button>
        <button class="btn btn-primary" onclick="GRAFT.openNewProject()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New project
        </button>
      </div>
    </header>

    <!-- Search, filter, group, sort, view and save-view — the same component
         on every list surface. Populated by app.js on load. -->
    <div class="org-bar" id="org-bar"></div>

    <div id="projects-grid">
      <div class="loading-state">Loading projects…</div>
    </div>
  </main>
</div>

<!-- New Project Modal -->
<div class="modal-overlay" id="modal-new-project" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-project-title">New project</h2>
      <button class="modal-close" onclick="GRAFT.closeModal('modal-new-project')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form onsubmit="GRAFT.submitProject(event)">
      <input type="hidden" id="project-edit-id" value="">
      <div class="form-group">
        <label class="form-label">Name</label>
        <input type="text" class="form-input" id="project-name" placeholder="e.g. Patchwork v2" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-input form-textarea" id="project-description" placeholder="What's this project about?"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-input" id="project-status">
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Colour</label>
          <div class="colour-picker" id="colour-picker">
            <div class="colour-swatch selected" data-colour="#6366f1" style="background:#6366f1"></div>
            <div class="colour-swatch" data-colour="#8b5cf6" style="background:#8b5cf6"></div>
            <div class="colour-swatch" data-colour="#ec4899" style="background:#ec4899"></div>
            <div class="colour-swatch" data-colour="#ef4444" style="background:#ef4444"></div>
            <div class="colour-swatch" data-colour="#f97316" style="background:#f97316"></div>
            <div class="colour-swatch" data-colour="#eab308" style="background:#eab308"></div>
            <div class="colour-swatch" data-colour="#22c55e" style="background:#22c55e"></div>
            <div class="colour-swatch" data-colour="#06b6d4" style="background:#06b6d4"></div>
            <div class="colour-swatch" data-colour="#3b82f6" style="background:#3b82f6"></div>
            <div class="colour-swatch" data-colour="#64748b" style="background:#64748b"></div>
          </div>
          <input type="hidden" id="project-colour" value="#6366f1">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="project-area">Area</label>
        <select class="form-input" id="project-area">
          <option value="">No area</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Icon</label>
        <div class="icon-picker" id="icon-picker"></div>
        <input type="hidden" id="project-icon" value="">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="GRAFT.closeModal('modal-new-project')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save project</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script src="app.js"></script>
<script>GRAFT.init();</script>
</body>
</html>
