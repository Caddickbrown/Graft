<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issues — Graft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav class="sidebar">
    <div class="sidebar-brand">
      <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">
        <span class="brand-mark">✦</span>
        <span class="brand-name">Graft</span>
      </a>
    </div>
    <div class="nav-section">
      <a href="index.html" class="nav-item" data-page="projects">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="9" height="9" rx="1"/><rect x="13" y="3" width="9" height="9" rx="1"/><rect x="2" y="13" width="9" height="9" rx="1"/><rect x="13" y="13" width="9" height="9" rx="1"/></svg>
        Projects
      </a>
      <a href="issues.html" class="nav-item active" data-page="issues">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        All issues
      </a>
    </div>
    <div class="nav-section nav-projects" id="sidebar-projects"></div>
  </nav>

  <main class="main">
    <header class="page-header">
      <div>
        <h1 class="page-title">All issues</h1>
        <p class="page-subtitle" id="issues-subtitle">Loading…</p>
      </div>
      <button class="btn btn-primary" onclick="GRAFT.openNewIssue()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New issue
      </button>
    </header>

    <div class="filter-bar">
      <div class="filter-group">
        <select class="form-input filter-select" id="filter-project" onchange="GRAFT.applyFilters()">
          <option value="">All projects</option>
        </select>
        <select class="form-input filter-select" id="filter-milestone" onchange="GRAFT.applyFilters()">
          <option value="">All milestones</option>
          <option value="none">No milestone</option>
        </select>
        <select class="form-input filter-select" id="filter-status" onchange="GRAFT.applyFilters()">
          <option value="">All statuses</option>
          <option value="backlog">Backlog</option>
          <option value="todo">Todo</option>
          <option value="in-progress">In progress</option>
          <option value="review">Review</option>
          <option value="done">Done</option>
        </select>
        <select class="form-input filter-select" id="filter-priority" onchange="GRAFT.applyFilters()">
          <option value="">All priorities</option>
          <option value="urgent">Urgent</option>
          <option value="high">High</option>
          <option value="normal">Normal</option>
          <option value="low">Low</option>
        </select>
        <select class="form-input filter-select" id="filter-assignee" onchange="GRAFT.applyFilters()">
          <option value="">All assignees</option>
        </select>
      </div>
      <input type="search" class="form-input search-input" id="filter-search" placeholder="Search issues…" oninput="GRAFT.applyFilters()">
    </div>

    <div class="issue-list" id="issue-list">
      <div class="loading-state">Loading issues…</div>
    </div>
  </main>
</div>

<!-- New/Edit Issue Modal -->
<div class="modal-overlay" id="modal-new-issue" style="display:none">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-issue-title">New issue</h2>
      <button class="modal-close" onclick="GRAFT.closeModal('modal-new-issue')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form onsubmit="GRAFT.submitIssue(event)">
      <input type="hidden" id="issue-edit-id" value="">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" class="form-input" id="issue-title" placeholder="Short description of the issue" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-input form-textarea" id="issue-description" placeholder="More detail, steps to reproduce, etc."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Project</label>
          <select class="form-input" id="issue-project" onchange="GRAFT.loadMilestonesForProject()" required>
            <option value="">Select project</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Milestone</label>
          <select class="form-input" id="issue-milestone">
            <option value="">No milestone</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-input" id="issue-status">
            <option value="backlog">Backlog</option>
            <option value="todo">Todo</option>
            <option value="in-progress">In progress</option>
            <option value="review">Review</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select class="form-input" id="issue-priority">
            <option value="urgent">🔴 Urgent</option>
            <option value="high">🟠 High</option>
            <option value="normal" selected>⚪ Normal</option>
            <option value="low">⬇️ Low</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Assignee</label>
          <input type="text" class="form-input" id="issue-assignee" placeholder="e.g. Dan, Hermes, Tom…">
        </div>
        <div class="form-group">
          <label class="form-label">Labels <span class="form-hint">(comma separated)</span></label>
          <input type="text" class="form-input" id="issue-labels" placeholder="e.g. bug, frontend, api">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="GRAFT.closeModal('modal-new-issue')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save issue</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>GRAFT.initIssues();</script>
</body>
</html>
