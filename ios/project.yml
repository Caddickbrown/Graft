name: Graft
options:
  bundleIdPrefix: com.caddickbrown
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: en
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    # Xcode's "recommended settings" prompt asks for these two. They live here
    # rather than being accepted in Xcode, because `xcodegen generate` rewrites
    # project.pbxproj and would discard anything set in the IDE.
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    STRING_CATALOG_GENERATE_SYMBOLS: 'YES'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: 52W73J6V95
    CODE_SIGN_STYLE: Automatic
targets:
  Graft:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - '*.md'
          - 'project.yml'
          - 'make_icon.swift'
          - '.git'
          - '.gitignore'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caddickbrown.graft
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: 52W73J6V95
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
    dependencies: []
schemes:
  Graft:
    build:
      targets:
        Graft: all
    run:
      config: Debug
    archive:
      config: Release
