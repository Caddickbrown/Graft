name: Graft
options:
  bundleIdPrefix: com.caddickbrown
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: en
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    # Xcode's "recommended settings" prompt asks for these three. They live here
    # rather than being accepted in Xcode, because `xcodegen generate` rewrites
    # project.pbxproj and would discard anything set in the IDE.
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    STRING_CATALOG_GENERATE_SYMBOLS: 'YES'
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: 'YES'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: 52W73J6V95
    CODE_SIGN_STYLE: Automatic
targets:
  Graft:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - '**/*.md'
          - 'project.yml'
          - 'make_icon.swift'
          - '.git'
          - '.gitignore'
    # The App Group Hub shares with Graft, for edits handed over on the same
    # phone (Services/HubHandoff.swift). xcodegen writes Graft.entitlements from
    # these properties and points CODE_SIGN_ENTITLEMENTS at it. A signed build
    # needs the group registered for this App ID in the developer portal; CI
    # builds with CODE_SIGNING_ALLOWED=NO, where the container is simply nil.
    entitlements:
      path: Graft.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.caddickbrown.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caddickbrown.graft
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: 52W73J6V95
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
    dependencies:
      # System SQLite, for ios/Storage. No packages, so there is nothing to
      # resolve on first open.
      - sdk: libsqlite3.tbd
schemes:
  Graft:
    build:
      targets:
        Graft: all
    run:
      config: Debug
    archive:
      config: Release
