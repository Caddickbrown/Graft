name: iOS

on:
  push:
    branches: [ master ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  pull_request:
    branches: [ master ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]

# macOS minutes are the expensive ones: only build when the app changed, and
# drop a superseded run on the same branch.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The .xcodeproj is generated, not committed (see .gitignore), so CI makes
      # it the same way a developer does.
      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project ios/Graft.xcodeproj \
            -scheme Graft \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
