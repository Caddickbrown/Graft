name: Server

on:
  push:
    branches: [ master ]
    paths: [ 'server/**', 'requirements.txt', '.github/workflows/server.yml' ]
  pull_request:
    branches: [ master ]
    paths: [ 'server/**', 'requirements.txt', '.github/workflows/server.yml' ]

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Byte-compiling catches syntax errors without installing Flask. There are
      # no server tests yet; this is the floor, not the ceiling.
      - name: Compile
        run: python -m py_compile server/app.py
